name: Add Roster Batch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests google-api-python-client yt-dlp

      - name: Resolve roster handles
        run: python sync.py

      - name: Ingest approved channels
        run: python ingest.py

      - name: Fetch avatars
        run: python avatars.py

      - name: Snapshot views (first reading)
        run: python snapshot.py

      - name: Build chart
        run: python chart.py

      - name: Build newest feed
        run: python newest.py

      - name: Update playlists
        run: python playlists.py

      - name: Snapshot views (second reading)
        run: python snapshot.py

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --quiet && git diff --staged --quiet; then exit 0; fi
          git commit -m "Add roster batch"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push failed, retry $i"
            sleep $((i * 5))
          done
          exit 1
